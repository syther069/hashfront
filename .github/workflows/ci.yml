name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (typecheck, unit tests, builds)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (circuits, CLI, watcher, web)
        run: npm test
      - name: Build the policy circuit
        run: npm run build -w circuits
      - name: Build the demo dApp and the web app
        run: |
          npm run build -w apps/demo-dapp
          npm run build -w apps/web
      - name: Pre-flight both builds for DeWEB
        run: |
          node packages/cli/src/main.ts preflight apps/demo-dapp/dist
          node packages/cli/src/main.ts preflight apps/web/dist

  contracts:
    name: Contracts (forge build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Build
        working-directory: contracts
        run: forge build
      - name: Unit, fuzz and manifest-compatibility tests
        working-directory: contracts
        # fork tests read X Layer mainnet; they run locally (README) so CI never depends on a public RPC
        run: forge test --no-match-path "test/fork/*"

  e2e:
    name: End-to-end (status page and Guard, on a local anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The watcher end-to-end tests fork X Layer mainnet through a public RPC, so they stay a local check (AGENTS.md).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: npm ci --no-audit --no-fund
      - name: Build the demo dApp (good and hijack copies)
        run: |
          npm run build -w apps/demo-dapp
          npm run build:hijack -w apps/demo-dapp
      - name: Status page, approve page, suspects and batch revoke (Playwright on the runner's Chrome, anvil)
        run: npm run test:e2e -w apps/web
      - name: Hashfront Guard (the real extension in Playwright's Chromium, both script orders)
        # branded Chrome 137+ ignores --load-extension, so this one test uses the Chromium that Playwright downloads
        run: |
          npx playwright install --with-deps chromium
          PW_CHANNEL=chromium xvfb-run -a npm run test:e2e -w apps/guard
