<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hashfront Guard</title>
    <style>
      body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; width: 300px; margin: 0; padding: 16px; background: #111114; color: #aeaeb3; }
      h3 { margin: 0 0 8px; font-size: 1.25rem; color: #d3d3d8; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0 0 8px; }
      .ok { color: #3fbf95; font-weight: 600; }
      .alert { color: #ff6b5e; font-weight: 600; }
      .warn { color: #e0a84f; font-weight: 600; }
      .muted { color: #9a9aa3; }
      a { color: #d3d3d8; }
      a:focus-visible { outline: 2px solid #d3d3d8; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <h3>Hashfront Guard</h3>
    <p id="state" class="muted">Reading the status…</p>
    <p id="release" class="muted"></p>
    <p><a id="page" href="#" target="_blank" rel="noopener noreferrer">Status page</a></p>
    <script src="popup.js"></script>
  </body>
</html>
